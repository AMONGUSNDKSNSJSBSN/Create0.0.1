name: Run Gradle Task Manually

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task to run (e.g., build, test, clean, hello)"
        required: true
        default: "build"

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run specified Gradle task
        run: ./gradlew ${{ github.event.inputs.gradle_task }}
